name: Scrape Restaurant Menus

on:
  schedule:
    # Target: scrape from ~08:30 until 13:59 Prague, retrying every ~30 min
    # until complete. GitHub cron is best-effort — runs fire 30-90+ min late
    # or get dropped entirely, and :00/:30 slots are the most congested. So:
    # many redundant off-peak slots (6-12 UTC covers the Prague window in both
    # CET and CEST), gated at runtime on Prague time.
    - cron: '25,55 6-12 * * 1-5'
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - master
    paths:
      - 'lib/scrapers/**'
      - '.github/workflows/scrape-menus.yml'

permissions:
  contents: write

jobs:
  scrape:
    concurrency:
      group: scrape-menus
      cancel-in-progress: false
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Sync with latest master
      # Scheduled runs check out the SHA from trigger time; a run queued behind
      # another one would otherwise miss the commit it just pushed, re-scrape
      # everything, and fail to push.
      run: git pull --ff-only origin master

    - name: Determine Prague time
      id: time
      run: |
        # %-H (no zero padding) — "0830" would trip bash octal parsing in
        # comparisons; %-H%M yields e.g. "830" for 08:30, "1355" for 13:55
        echo "prague_hm=$(TZ=Europe/Prague date +%-H%M)" >> $GITHUB_OUTPUT
        echo "prague_date=$(TZ=Europe/Prague date +%F)" >> $GITHUB_OUTPUT

    - name: Check completeness for today
      id: check
      env:
        DATE: ${{ steps.time.outputs.prague_date }}
      run: |
        set +e
        python3 .github/scripts/check-complete.py "$DATE"
        rc=$?
        set -e
        [ $rc -gt 1 ] && exit 1
        echo "complete=$([ $rc -eq 0 ] && echo true || echo false)" >> $GITHUB_OUTPUT

    - name: Decide whether to run scrapers now
      id: decide
      env:
        EVENT_NAME: ${{ github.event_name }}
      run: |
        HM="${{ steps.time.outputs.prague_hm }}"
        COMPLETE="${{ steps.check.outputs.complete }}"
        SHOULD_RUN=false
        if [ "$EVENT_NAME" != "schedule" ]; then
          # workflow_dispatch and scraper-code pushes always run
          SHOULD_RUN=true
        elif [ "$HM" -ge 820 ] && [ "$HM" -le 1359 ] && [ "$COMPLETE" != "true" ]; then
          # Scraping is incremental and idempotent, so the completeness check
          # is the real guard — any slot landing in the window may retry.
          # Before ~08:30 menus may not be published (or still show
          # yesterday's); after 13:59 lunch is over.
          SHOULD_RUN=true
        fi
        echo "should_run=$SHOULD_RUN" >> $GITHUB_OUTPUT

    - name: Set up Node.js
      if: steps.decide.outputs.should_run == 'true'
      uses: actions/setup-node@v5
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      if: steps.decide.outputs.should_run == 'true'
      run: npm ci

    - name: Install Playwright browsers and deps
      if: steps.decide.outputs.should_run == 'true'
      run: npx playwright install --with-deps chromium

    - name: Scrape until complete
      if: steps.decide.outputs.should_run == 'true'
      # One delivered trigger has to cover the whole day: GitHub's scheduler
      # drops most cron events for this repo (community discussion 207346),
      # so retry in-process rather than relying on a later run arriving.
      timeout-minutes: 345
      env:
        NODE_ENV: production
        DATE: ${{ steps.time.outputs.prague_date }}
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

        while true; do
          npm run scrape || echo "scrape pass failed, retrying later"

          if [[ -n $(git status --porcelain public/data/menus/) ]]; then
            git add public/data/menus/
            git commit -m "🍽️ Update restaurant menus [skip ci]

        Automated menu update from GitHub Actions
        Time: $(TZ=Europe/Prague date +'%Y-%m-%d %H:%M:%S %Z')"
            git pull --rebase origin master
            git push
          fi

          set +e
          MISSING=$(python3 .github/scripts/check-complete.py "$DATE")
          rc=$?
          set -e
          [ $rc -eq 0 ] && echo "every restaurant has priced items" && break
          [ $rc -gt 1 ] && exit 1
          echo "still missing: $MISSING"

          HM=$(TZ=Europe/Prague date +%-H%M)
          if [ "$HM" -ge 1359 ]; then
            echo "13:59 Prague reached, stopping for today"
            break
          fi

          sleep 900
          # a manual run may have filled menus in the meantime
          git pull --rebase origin master || true
        done
